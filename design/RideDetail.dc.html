<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#2F4A3E; color:#1A1A1A; -webkit-font-smoothing:antialiased; }
    a { color:#2E3B6E; text-decoration:none; }
    a:hover { color:#1f2a52; }
  </style>
</helmet>
<div style="min-height:100%; box-sizing:border-box; padding:24px 16px; display:flex; justify-content:center; background:#2F4A3E;">
  <div style="width:100%; max-width:460px; background:#DCE8E3; border-radius:20px; box-shadow:0 6px 28px rgba(0,0,0,0.28); padding:8px 0 32px;">
    <div style="max-width:420px; margin:0 auto; padding:16px;">

      <div style="color:#5F5E5A; font-size:14px; margin-bottom:12px; cursor:pointer;">&#8592; Back</div>

      <div style="background:#FAF3E8; border-radius:16px; overflow:hidden;">

        <div style="padding:20px; border-bottom:0.5px solid #DAD5D8;">
          <p style="font-size:18px; font-weight:500; margin:0 0 4px;">Ride</p>
          <p style="font-size:13px; color:#5F5E5A; margin:0;">Monday, 1 September 2025</p>
        </div>

        <div style="padding:16px; border-bottom:0.5px solid #DAD5D8; display:flex; flex-direction:column; gap:14px;">
          <div>
            <label style="font-size:13px; color:#5F5E5A; display:block; margin-bottom:6px;">Date</label>
            <input type="date" value="2025-09-01" style="font-family:inherit; font-size:14px; padding:9px 10px; border-radius:8px; border:0.5px solid #DAD5D8; background:#ffffff; width:100%; box-sizing:border-box;" />
          </div>
          <div>
            <label style="font-size:13px; color:#5F5E5A; display:block; margin-bottom:6px;">Distance (km)</label>
            <input type="number" value="32" style="font-family:inherit; font-size:14px; padding:9px 10px; border-radius:8px; border:0.5px solid #DAD5D8; background:#ffffff; width:100%; box-sizing:border-box;" />
          </div>
          <div>
            <label style="font-size:13px; color:#5F5E5A; display:block; margin-bottom:6px;">Notes</label>
            <textarea rows="3" style="font-family:inherit; font-size:14px; padding:9px 10px; border-radius:8px; border:0.5px solid #DAD5D8; background:#ffffff; width:100%; box-sizing:border-box; resize:none;">Morning loop, headwind coming back along the coast road.</textarea>
          </div>
        </div>

        <div style="padding:14px 16px; border-bottom:0.5px solid #DAD5D8; display:flex; gap:8px;">
          <button style="flex:1; font-family:inherit; font-size:14px; font-weight:500; border-radius:8px; padding:10px 14px; cursor:pointer; background:transparent; color:#2E3B6E; border:0.5px solid #2E3B6E;">Cancel</button>
          <button style="flex:1; font-family:inherit; font-size:14px; font-weight:500; border-radius:8px; padding:10px 14px; cursor:pointer; background:#2E3B6E; color:#ffffff; border:none;">Save changes</button>
        </div>

        <div style="padding:16px;">
          <button style="width:100%; font-family:inherit; font-size:14px; font-weight:500; border-radius:8px; padding:10px 14px; cursor:pointer; background:transparent; color:#A32D2D; border:0.5px solid #A32D2D;">Delete ride</button>
          <p style="font-size:12px; color:#5F5E5A; margin:8px 0 0; text-align:center; line-height:1.4;">Removes this ride and takes its 32 km back off the components it counted toward.</p>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
